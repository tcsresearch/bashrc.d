# INI Config File for BRCD #
#

# ----- Folder Paths ----- #
[BRCD-FolderPaths]
  BRCDPath="/etc/bashrc.d"  # Needs to be dynamically changed based on AmiRoot
  BRCDPath_Root="/etc/bashrc.d"
  BRCDPath_NonRoot="/etc/bashrc.d"
  
  BLINGPath="/etc/BLING/functions"
  PS1ConfigToolPath="/etc/PS1ConfigTool" # New For v6

  CONFIG_DIR="$(pwd)/config"
  FUNC_DIR="$(pwd)/functions"

# ----- LibINI ----- #
  FUNC_FILE="lib_ini.bfunc"


# ----- File Names ----- #
[BRCD-FileNames]
PreLoader_FileName="AdvPreLoader.sh"
Cecho_FileName="Cecho.bfunc"

# ----- Colors ----- #
# Colors for Cecho-like output
# COLORS_FILE="AdvPreLoader_Colors.conf"  # Will eventually be replaced by Cecho.
  COLORS_FILE="Colors2.conf"  # Will eventually be replaced by Cecho.

# ----- Main Config ----- #
  CONFIG_FILE="BRCD_Loader.conf"



